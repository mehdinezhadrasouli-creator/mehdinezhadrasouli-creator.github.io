<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" role="img" aria-label="An editorial illustration of two chairs facing each other in a quiet coaching room">
<defs>
 <linearGradient id="wall" x1="0" x2="1"><stop stop-color="#e6d8bc"/><stop offset=".52" stop-color="#f0e7d5"/><stop offset="1" stop-color="#d8decf"/></linearGradient>
 <linearGradient id="floor" x1="0" x2="1"><stop stop-color="#c3aa8b"/><stop offset="1" stop-color="#dfd0b8"/></linearGradient>
 <linearGradient id="cushion" x1="0" x2="1"><stop stop-color="#2d6555"/><stop offset="1" stop-color="#153d34"/></linearGradient>
 <linearGradient id="chair2" x1="0" x2="1"><stop stop-color="#aa785b"/><stop offset="1" stop-color="#805744"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff1cf" stop-opacity=".8"/><stop offset="1" stop-color="#fff1cf" stop-opacity="0"/></radialGradient>
 <filter id="shade"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="980" height="660" fill="url(#wall)"/>
<circle cx="795" cy="145" r="220" fill="url(#sun)"/>
